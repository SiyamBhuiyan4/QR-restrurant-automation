services:
  - type: web
    name: smartdine-server
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: TLS_DISABLED
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_MASTER_PIN
        sync: false
      - key: NODE_VERSION
        value: "22"
    disk:
      name: smartdine-data
      mountPath: /var/data
      sizeGB: 1
